<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <section class="apply-section">

    <!-- Left Side -->
    <div class="apply-content">

        <span class="section-tag">Apply Online</span>

        <h2>Get Your Loan Approved<br>Within Minutes</h2>

        <p>
            Apply for a personal loan with CredAdvance in just a few
            simple steps. Fast approval, secure process, and flexible
            repayment options.
        </p>

        <div class="features">

            <div class="feature">
                <i class="fa-solid fa-circle-check"></i>
                <span>Instant Online Application</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-circle-check"></i>
                <span>100% Secure Verification</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-circle-check"></i>
                <span>Quick Loan Approval</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-circle-check"></i>
                <span>Low Interest Rates</span>
            </div>

        </div>

    </div>

    <!-- Right Side -->
    <div class="apply-box">

        <img src="https://images.unsplash.com/photo-1554224154-26032ffc0d07?w=900"
        alt="Loan Application">

        <div class="form-card">

            <h3>Apply for Loan</h3>

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

                <input type="tel" placeholder="Phone Number" required>

                <input type="number" placeholder="Loan Amount (₹)" required>

                <select required>
                    <option>Select Loan Type</option>
                    <option>Personal Loan</option>
                    <option>Business Loan</option>
                    <option>Education Loan</option>
                    <option>Home Loan</option>
                </select>

                <button type="submit">
                    Apply Now
                </button>

            </form>

        </div>

    </div>

</section>

</body>
</html>
