<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <section class="contact-section">

    <div class="contact-left">

        <span class="badge">Contact Us</span>

        <h2>Let's Talk About Your Financial Goals</h2>

        <p>
            Have questions about loans or our financial services?
            Our experts are ready to help you find the perfect solution.
        </p>

        <div class="contact-info">

            <div class="info-box">
                <i class="fa-solid fa-phone"></i>
                <div>
                    <h4>Call Us</h4>
                    <p>+91 98765 43210</p>
                </div>
            </div>

            <div class="info-box">
                <i class="fa-solid fa-envelope"></i>
                <div>
                    <h4>Email</h4>
                    <p>support@credadvance.com</p>
                </div>
            </div>

            <div class="info-box">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <h4>Office</h4>
                    <p>New Delhi, India</p>
                </div>
            </div>

        </div>

    </div>

    <div class="contact-right">

        <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=900"
            alt="Customer Support">

        <div class="contact-form">

            <h3>Send a Message</h3>

            <form>

                <input type="text" placeholder="Your Name">

                <input type="email" placeholder="Email Address">

                <input type="tel" placeholder="Phone Number">

                <textarea rows="5" placeholder="Write your message..."></textarea>

                <button type="submit">Submit Request</button>

            </form>

        </div>

    </div>

</section>

</body>
</html>
